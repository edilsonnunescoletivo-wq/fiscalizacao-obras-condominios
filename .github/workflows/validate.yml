name: Validar Fiscalizacao de Obras

on:
  push:
    branches:
      - feature/base-inicial-20261008
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: fiscalizacao_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom, fileinfo
          tools: composer:v2

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validar sintaxe PHP
        shell: bash
        run: |
          set -euo pipefail
          find app config public scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find . -maxdepth 1 -type f -name 'resources*.php' -print0 | xargs -0 -n1 php -l

      - name: Conferir migrations
        shell: bash
        run: |
          set -euo pipefail
          test -f database/migrations/001_initial.sql
          test -f database/migrations/009_schema_migrations.sql
          test -f database/migrations/010_super_admin_password_setup.sql
          count=$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
          test "$count" -ge 10
          echo "Migrations encontradas: $count"

      - name: Aplicar migrations em MySQL temporario
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_DATABASE: fiscalizacao_test
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: rootpass
        run: php scripts/validate_migrations.php
